name: Apply warm UI polish

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-warm-ui-polish.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-ui-polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply UI-only polish
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          faculty = Path("app/faculty_ui.py")
          text = faculty.read_text(encoding="utf-8")
          if "stage_help = {" not in text:
              marker = "        st.markdown(\n            '<div class=\"fx-side-label\">System</div>"
              idx = text.find(marker)
              if idx == -1:
                  raise SystemExit("Could not find sidebar System marker")
              help_block = '''        stage_help = {
            "intake": ("Case intake", "Choose a source path. For first use, the synthetic demonstration is the fastest way to see the complete workflow. For a real research case, use de-identified content only."),
            "review": ("Review the represented case", "Compare the structured case with the source material. Correct representation errors before continuing. Do not confirm information that is unsupported or missing from the source."),
            "evidence": ("Review evidence candidates", "Inspect the displayed source candidates. Select only records you have actually reviewed and attest only the exact records that may enter the governed case analysis."),
            "analysis": ("Run governed analysis", "The system now evaluates case integrity, missingness, specialist evidence, challenge findings, and consensus. If a safety gate stops the workflow, return to the prior step rather than bypassing it."),
            "brief": ("Use the decision brief", "Review the decision state, evidence availability, missing information, Challenge Review, uncertainty, and what could change the conclusion. Use Ask Tumor Board for case-grounded follow-up questions."),
        }
        stage_key = str(st.session_state.get("stage", "")).lower()
        help_title, help_text = stage_help.get(
            stage_key,
            ("Getting started", "Use the Overview for a plain-language introduction, then open the Clinical Workspace. Each workflow stage explains what to do before you continue."),
        )
        st.markdown(
            '<div class="fx-side-label">How to use this screen</div>'
            f'<div class="fx-side-help"><strong>{escape(help_title)}</strong><span>{escape(help_text)}</span></div>',
            unsafe_allow_html=True,
        )

'''
              text = text[:idx] + help_block + text[idx:]
              faculty.write_text(text, encoding="utf-8")

          arch = Path("app/assets/architecture_interactive.html")
          html = arch.read_text(encoding="utf-8")
          html = html.replace("--paper:#0a0a0a", "--paper:#f7f7f4")
          html = html.replace("--white:#141414", "--white:#ffffff")
          html = html.replace("--navy:#ffffff", "--navy:#26251e")
          html = html.replace("--gray:#7d8187", "--gray:#807d72")
          html = html.replace("--grayTint:#191919", "--grayTint:#fafaf7")
          html = html.replace("--rule:#2a2d31", "--rule:#e6e5e0")
          html = html.replace("--text:#dadbdf", "--text:#5a5852")
          html = html.replace("--muted:#7d8187", "--muted:#807d72")
          html = html.replace(".meta b{color:#fff}", ".meta b{color:#26251e}")
          html = html.replace("background:#0d0d0d", "background:#ffffff")
          html = html.replace("box-shadow:0 4px 14px rgba(16,42,67,.05)", "box-shadow:none")
          html = html.replace("filter:drop-shadow(0 4px 7px rgba(16,42,67,.12))", "filter:none")
          html = html.replace("box-shadow:0 16px 44px rgba(16,42,67,.26)", "box-shadow:none")

          node_map = {
              "#10161c": "#eaf3fc",
              "#1a1014": "#fff0f5",
              "#19150d": "#fff8e7",
              "#0e1917": "#eaf8f6",
              "#161119": "#f5eff8",
          }
          for old_bg, new_bg in node_map.items():
              pattern = re.compile(r'(<g class="node"[^>]*>.*?<rect[^>]*fill="' + re.escape(old_bg) + r'".*?</g>)')
              def repl(match, old_bg=old_bg, new_bg=new_bg):
                  group = match.group(1).replace(f'fill="{old_bg}"', f'fill="{new_bg}"', 1)
                  group = group.replace('fill="#ffffff"', 'fill="#26251e"')
                  return group
              html = pattern.sub(repl, html)

          html = html.replace('fill="#171719" stroke="#3a3c40"', 'fill="#fafaf7" stroke="#e6e5e0"')
          html = html.replace('fill="#0d0d0d" stroke="#2a2d31"', 'fill="#ffffff" stroke="#e6e5e0"')
          html = html.replace('fill="#0d0d0d" stroke="#203b36"', 'fill="#ffffff" stroke="#dbe9e4"')
          html = html.replace('fill="#0d0d0d" stroke="#392b43"', 'fill="#ffffff" stroke="#e7dfee"')
          arch.write_text(html, encoding="utf-8")
          PY

      - name: Verify syntax
        run: python -m compileall -q app

      - name: Commit UI changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/faculty_ui.py app/assets/architecture_interactive.html
          if git diff --cached --quiet; then
            echo "No UI polish changes needed"
          else
            git commit -m "Add guided sidebar help and warm interactive architecture"
            git push origin main
          fi
