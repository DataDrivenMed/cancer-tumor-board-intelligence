name: Faculty UI Upgrade v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/faculty-ui-upgrade-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Reuse tested migration patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/faculty-ui-upgrade.yml').read_text(encoding='utf-8')
          start_marker = '      - name: Apply faculty-facing UI upgrade\n        shell: python\n        run: |\n'
          end_marker = '      - name: Validate syntax and focused tests\n'
          block = workflow.split(start_marker, 1)[1].split(end_marker, 1)[0]
          script = textwrap.dedent(block)
          exec(compile(script, 'faculty-ui-migration', 'exec'))
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate syntax and focused tests
        run: |
          python -m py_compile app/main.py app/faculty_ui.py app/pages/00_Clinical_Workspace.py app/pages/01_Validation.py app/pages/02_About.py
          python -m pytest -q tests/test_faculty_experience_ui.py tests/test_workspace_pdf_case_reference.py tests/test_tumor_board_pdf.py
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/main.py app/faculty_ui.py app/pages/00_Clinical_Workspace.py app/pages/01_Validation.py app/pages/02_About.py tests/test_faculty_experience_ui.py
          git commit -m "Upgrade faculty UI and add governed Tumor Board chat"
          git push origin HEAD:main
