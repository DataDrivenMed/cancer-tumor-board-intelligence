name: Final Faculty Product Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-faculty-product-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch final faculty UI and governed chat integration
        shell: python
        run: |
          from pathlib import Path

          faculty = Path('app/faculty_ui.py')
          text = faculty.read_text(encoding='utf-8')

          replacements = {
              '.fx-product{font-size:17px': '.fx-product{font-size:32px',
              '.fx-author{font-size:11px': '.fx-author{font-size:14px',
              '.fx-mode{font-size:10px': '.fx-mode{font-size:12px',
              '.fx-card h3{font-size:14px': '.fx-card h3{font-size:16px',
              '.fx-card p{font-size:11px': '.fx-card p{font-size:13px',
              '.fx-icon{width:28px;height:28px': '.fx-icon{width:32px;height:32px',
              '.fx-node strong{display:block;font-size:13px': '.fx-node strong{display:block;font-size:15px',
              '.fx-node span{font-size:10px': '.fx-node span{font-size:12px',
              '.fx-lbl{font-size:8px': '.fx-lbl{font-size:10px',
              '.fx-val{font-size:11px': '.fx-val{font-size:13px',
              '.fx-synthetic{display:inline-flex;align-items:center;gap:5px;padding:4px 8px;border-radius:999px;background:var(--fx-violet-soft);color:var(--fx-violet);font-size:9px': '.fx-synthetic{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:999px;background:var(--fx-violet-soft);color:var(--fx-violet);font-size:11px',
              '.fx-thirty-sub{font-size:10px': '.fx-thirty-sub{font-size:12px',
              '.fx-thirty-cell .fx-val{color:#fff;white-space:normal;font-size:12px': '.fx-thirty-cell .fx-val{color:#fff;white-space:normal;font-size:14px',
              '.fx-decision-banner p{font-size:12px': '.fx-decision-banner p{font-size:14px',
              '.fx-panel-title{font-size:17px': '.fx-panel-title{font-size:21px',
              '.fx-panel-sub{font-size:11px': '.fx-panel-sub{font-size:13px',
              '.fx-challenge p{color:#cbd5df;font-size:11px': '.fx-challenge p{color:#cbd5df;font-size:13px',
              '.fx-missing strong{font-size:13px': '.fx-missing strong{font-size:15px',
              '.fx-missing p{font-size:11px': '.fx-missing p{font-size:13px',
              '.fx-status strong{font-size:12px': '.fx-status strong{font-size:14px',
              '.fx-status span{font-size:10px': '.fx-status span{font-size:12px',
              '.fx-program strong{font-size:12px': '.fx-program strong{font-size:14px',
              '.fx-program span{display:block;font-size:9px': '.fx-program span{display:block;font-size:11px',
              '.fx-footer{border-top:1px solid var(--fx-line);margin-top:34px;padding:14px 0 4px;font-size:9px': '.fx-footer{border-top:1px solid var(--fx-line);margin-top:34px;padding:14px 0 4px;font-size:11px',
              'summary p::after{content:"  ·  View details";font-size:9px': 'summary p::after{content:"  ·  View details";font-size:11px',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)

          old_nav = '''def top_navigation(active: str) -> None:\n    cols = st.columns([1,1,1,1,3], gap="small")\n    links = [\n        ("main.py", "Overview", "overview"),\n        ("pages/00_Clinical_Workspace.py", "Workspace", "workspace"),\n        ("pages/01_Validation.py", "Validation", "validation"),\n        ("pages/02_About.py", "About", "about"),\n    ]\n    for col, (page, label, key) in zip(cols[:4], links):\n        with col:\n            st.page_link(page, label=label, use_container_width=True, disabled=active == key)\n'''
          new_nav = '''def top_navigation(active: str) -> None:\n    cols = st.columns([1,1,1,1,1,2], gap="small")\n    links = [\n        ("main.py", "Overview", "overview"),\n        ("pages/00_Clinical_Workspace.py", "Workspace", "workspace"),\n        ("pages/01_Validation.py", "Validation", "validation"),\n        ("pages/03_Architecture.py", "Architecture", "architecture"),\n        ("pages/02_About.py", "About", "about"),\n    ]\n    for col, (page, label, key) in zip(cols[:5], links):\n        with col:\n            st.page_link(page, label=label, use_container_width=True, disabled=active == key)\n'''
          if old_nav not in text:
              raise SystemExit('top_navigation anchor not found')
          text = text.replace(old_nav, new_nav, 1)

          nav_css = '''\n[data-testid="stPageLink-NavLink"]{border:1px solid #d8e2ec!important;border-radius:10px!important;padding:.58rem .75rem!important;font-size:13px!important;font-weight:750!important;transition:all .15s ease;background:#f4f8fc!important;color:#23415d!important}\n[data-testid="stPageLink-NavLink"]:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(16,42,67,.06)}\n[data-testid="stPageLink-NavLink"][href*="Clinical_Workspace"]{background:#eaf8f7!important;border-color:#b9dfda!important;color:#176b5d!important}\n[data-testid="stPageLink-NavLink"][href*="Validation"]{background:#f4f0ff!important;border-color:#d9d0f5!important;color:#6749a2!important}\n[data-testid="stPageLink-NavLink"][href*="Architecture"]{background:#fff4e8!important;border-color:#efd2ac!important;color:#8a5a10!important}\n[data-testid="stPageLink-NavLink"][href*="About"]{background:#f1f3f6!important;border-color:#d9dde4!important;color:#4b5968!important}\n[data-testid="stPageLink-NavLink"][aria-disabled="true"]{box-shadow:inset 0 0 0 2px currentColor!important;opacity:1!important}\n'''
          text = text.replace('</style>', nav_css + '\n</style>', 1)
          faculty.write_text(text, encoding='utf-8')

          ws = Path('app/pages/00_Clinical_Workspace.py')
          w = ws.read_text(encoding='utf-8')
          w = w.replace('    faculty_css, render_case_context, render_case_chat, render_feedback,\n', '    faculty_css, render_case_context, render_feedback,\n', 1)
          anchor = '    research_footer, top_navigation,\n)\n'
          if anchor not in w:
              raise SystemExit('workspace faculty import anchor missing')
          w = w.replace(anchor, anchor + 'from app.chat_ui import render_governed_chat\n', 1)
          w = w.replace('render_case_chat(', 'render_governed_chat(')
          w = w.replace('st.columns([1.55, .85], gap="large")', 'st.columns([1.32, 1.0], gap="large")')

          ws_repl = {
              '.ws-name{font-size:16px': '.ws-name{font-size:22px',
              '.ws-sub{font-size:10px': '.ws-sub{font-size:13px',
              '.ws-ready{font-size:11px': '.ws-ready{font-size:12px',
              '.ws-num{font-size:9px': '.ws-num{font-size:11px',
              '.ws-label{font-size:12px': '.ws-label{font-size:14px',
              '.ws-eye{font-size:10px': '.ws-eye{font-size:12px',
              '.ws-hero h1{font-size:38px': '.ws-hero h1{font-size:43px',
              '.ws-hero p{font-size:14px': '.ws-hero p{font-size:16px',
              '.ws-title{font-size:14px': '.ws-title{font-size:16px',
              '.ws-copy{font-size:11px': '.ws-copy{font-size:13px',
              '.ws-section{font-size:19px': '.ws-section{font-size:23px',
              '.ws-section-sub{font-size:11px': '.ws-section-sub{font-size:13px',
              '.ws-call{background:var(--blueSoft);border:1px solid #d8e4ff;border-radius:var(--r);padding:11px 13px;font-size:11px': '.ws-call{background:var(--blueSoft);border:1px solid #d8e4ff;border-radius:var(--r);padding:12px 14px;font-size:13px',
              '.ws-alert{background:var(--warnBg);border:1px solid #efdfaa;border-radius:var(--r);padding:11px 13px;font-size:11px': '.ws-alert{background:var(--warnBg);border:1px solid #efdfaa;border-radius:var(--r);padding:12px 14px;font-size:13px',
              '.fl{font-size:9px': '.fl{font-size:10px',
              '.fv{font-size:14px': '.fv{font-size:16px',
              '.source{font-size:9px': '.source{font-size:10px',
              '.chip{display:inline-flex;padding:4px 8px;border-radius:999px;font-size:9px': '.chip{display:inline-flex;padding:5px 9px;border-radius:999px;font-size:11px',
              '.decision-label{font-size:9px': '.decision-label{font-size:11px',
              '.reason strong{font-size:11px': '.reason strong{font-size:13px',
              '.reason div{font-size:10px': '.reason div{font-size:12px',
              '.evidence-meta{font-size:10px': '.evidence-meta{font-size:12px',
              '.evidence-text{font-size:12px': '.evidence-text{font-size:14px',
          }
          for old, new in ws_repl.items():
              w = w.replace(old, new)
          ws.write_text(w, encoding='utf-8')

          test = Path('tests/test_final_faculty_product.py')
          test.write_text('''from pathlib import Path\n\nfrom services.governed_chat import answer_governed_question\n\n\ndef test_main_uses_final_overview():\n    text = Path("app/main.py").read_text(encoding="utf-8")\n    assert "render_final_overview" in text\n    assert "Pan-Oncology Tumor Board Intelligence" in Path("app/overview_ui.py").read_text(encoding="utf-8")\n\n\ndef test_architecture_page_and_agent_explorer_exist():\n    text = Path("app/architecture_ui.py").read_text(encoding="utf-8")\n    assert "Agent Explorer" in text\n    assert "Agent-to-agent handoffs and criteria" in text\n    assert "Clinical Red Team" in text\n    assert "Consensus Engine" in text\n    assert "Click an agent" in text\n    assert Path("app/pages/03_Architecture.py").exists()\n\n\ndef test_workspace_uses_governed_chat_ui():\n    text = Path("app/pages/00_Clinical_Workspace.py").read_text(encoding="utf-8")\n    assert "from app.chat_ui import render_governed_chat" in text\n    assert "render_governed_chat(" in text\n    assert "render_case_chat(" not in text\n\n\ndef test_governed_chat_fallback_treatment_question_does_not_invent():\n    class Fact:\n        value = "Acute myeloid leukemia"\n    class Q:\n        question = "What is the best treatment?"\n    class Case:\n        diagnosis = Fact()\n        disease_state = Fact()\n        stage = None\n        molecular_findings = []\n        clinical_question = Q()\n    out = answer_governed_question("what is the best treatment", {}, Case())\n    assert out["status"] in {"Evidence incomplete", "Unable to answer from current case evidence"}\n    assert "cannot establish" in out["answer"].lower() or "does not establish" in out["answer"].lower()\n\n\ndef test_governed_chat_trial_question_never_invents_trial():\n    class Fact:\n        value = "Acute myeloid leukemia"\n    class Q:\n        question = "Relevant trials"\n    class Case:\n        diagnosis = Fact()\n        disease_state = Fact()\n        stage = None\n        molecular_findings = []\n        clinical_question = Q()\n    out = answer_governed_question("relevant clinical trials", {}, Case())\n    assert "clinical-trial" in out["answer"].lower() or "trial" in out["answer"].lower()\n    assert not any(str(x).startswith("NCT") for x in out.get("evidence_used", []))\n''', encoding='utf-8')

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate final product
        run: |
          python -m py_compile app/main.py app/faculty_ui.py app/overview_ui.py app/architecture_ui.py app/chat_ui.py app/pages/00_Clinical_Workspace.py app/pages/03_Architecture.py services/governed_chat.py
          python -m pytest -q tests/test_final_faculty_product.py tests/test_faculty_experience_ui.py tests/test_workspace_pdf_case_reference.py tests/test_tumor_board_pdf.py
          python -m pytest -q

      - name: Commit final product upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/faculty_ui.py app/pages/00_Clinical_Workspace.py tests/test_final_faculty_product.py
          git commit -m "Finalize faculty UI architecture and governed chat"
          git push origin HEAD:main
