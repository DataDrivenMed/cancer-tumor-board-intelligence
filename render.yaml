services:
  - type: web
    name: tumor-board-intelligence-synthetic-api
    runtime: python
    plan: free
    region: ohio
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /ready
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.13
      - key: DEPLOYMENT_ENV
        value: synthetic_evaluation
      - key: DEPLOYMENT_PROFILE
        value: synthetic_evaluation
      - key: AUTH_MODE
        value: none
      - key: REQUIRE_HTTPS
        value: "true"
      - key: ENABLE_API_DOCS
        value: "false"
      - key: MAX_REQUEST_BYTES
        value: "2097152"
      - key: TUMOR_BOARD_STATE_DB
        value: /tmp/tumor_board_state.sqlite3
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: TRUSTED_HOSTS
        value: "*.onrender.com,localhost,127.0.0.1,testserver"
      - key: ENABLE_LIVE_PUBMED
        value: "false"
      - key: ENABLE_LIVE_CLINICALTRIALS
        value: "false"
      - key: RATE_LIMITING_MODE
        value: none
