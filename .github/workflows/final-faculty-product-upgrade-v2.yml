name: Final Faculty Product Upgrade v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-faculty-product-upgrade-v2.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse final faculty product patch
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          workflow = Path('.github/workflows/final-faculty-product-upgrade.yml').read_text(encoding='utf-8')
          start = '      - name: Patch final faculty UI and governed chat integration\n        shell: python\n        run: |\n'
          end = '      - name: Install dependencies\n'
          block = workflow.split(start, 1)[1].split(end, 1)[0]
          exec(compile(textwrap.dedent(block), 'final-faculty-product-patch', 'exec'))

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Validate final product
        run: |
          python -m py_compile app/main.py app/faculty_ui.py app/overview_ui.py app/architecture_ui.py app/chat_ui.py app/pages/00_Clinical_Workspace.py app/pages/03_Architecture.py services/governed_chat.py
          python -m pytest -q tests/test_final_faculty_product.py tests/test_faculty_experience_ui.py tests/test_workspace_pdf_case_reference.py tests/test_tumor_board_pdf.py
          python -m pytest -q

      - name: Commit final product upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/faculty_ui.py app/pages/00_Clinical_Workspace.py tests/test_final_faculty_product.py
          git commit -m "Finalize faculty UI architecture and governed chat"
          git push origin HEAD:main
