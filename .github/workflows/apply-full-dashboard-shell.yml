name: Apply full dashboard shell

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-full-dashboard-shell.yml

permissions:
  contents: write

jobs:
  apply-ui-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply presentation-only shell changes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          faculty = Path("app/faculty_ui.py")
          text = faculty.read_text(encoding="utf-8")
          start = text.index("def top_navigation(active: str) -> None:")
          end = text.index("\ndef research_footer() -> None:", start)
          replacement = '''def top_navigation(active: str) -> None:
              inject_xai_theme()
              links = [
                  ("main.py", "Overview", "overview"),
                  ("pages/00_Clinical_Workspace.py", "Workspace", "workspace"),
                  ("pages/01_Validation.py", "Validation", "validation"),
                  ("pages/03_Architecture.py", "Architecture", "architecture"),
                  ("pages/02_About.py", "About", "about"),
              ]

              with st.sidebar:
                  st.markdown(
                      '<div class="fx-side-brand"><div class="fx-side-mark">TB</div><div><div class="fx-side-name">Pan-Oncology</div><div class="fx-side-sub">Tumor Board Intelligence</div></div></div>',
                      unsafe_allow_html=True,
                  )
                  case = st.session_state.get("case")
                  if case is not None:
                      diagnosis = _txt(_val(getattr(case, "diagnosis", None), "value", None))
                      disease_state = _txt(_val(getattr(case, "disease_state", None), "value", None))
                      case_id = _txt(getattr(case, "case_id", None), "Current case")
                      st.markdown(
                          '<div class="fx-side-label">Current case</div><div class="fx-side-case"><div class="fx-side-live">Active</div>'
                          f'<strong>{escape(diagnosis)}</strong><span>{escape(disease_state)}</span><small>{escape(case_id)}</small></div>',
                          unsafe_allow_html=True,
                      )
                  else:
                      st.markdown(
                          '<div class="fx-side-label">Current case</div><div class="fx-side-case"><div class="fx-side-idle">No active case</div><span>Open the workspace to begin a governed case.</span></div>',
                          unsafe_allow_html=True,
                      )

                  st.markdown('<div class="fx-side-label">Navigate</div>', unsafe_allow_html=True)
                  for page, label, key in links:
                      st.page_link(page, label=label, use_container_width=True, disabled=active == key)

                  st.markdown(
                      '<div class="fx-side-label">System</div><div class="fx-side-system"><div><i></i><strong>Research mode</strong></div><span>De-identified or synthetic data only</span><div><i class="amber"></i><strong>Clinical release not established</strong></div></div>',
                      unsafe_allow_html=True,
                  )

              cols = st.columns([1, 1, 1, 1, 1, 2], gap="small")
              for col, (page, label, key) in zip(cols[:5], links):
                  with col:
                      st.page_link(page, label=label, use_container_width=True, disabled=active == key)
          '''
          faculty.write_text(text[:start] + replacement + text[end:], encoding="utf-8")

          theme = Path("app/xai_theme.py")
          text = theme.read_text(encoding="utf-8")
          marker = "/* persistent product rail */"
          if marker not in text:
              anchor = "/* reduce visual chrome */"
              css = r'''/* persistent product rail */
          [data-testid="stSidebar"]{display:block!important;background:#0d0d0d!important;border-right:1px solid var(--x-hair)!important;min-width:252px!important;max-width:252px!important}
          [data-testid="stSidebarNav"]{display:none!important}
          [data-testid="stSidebarContent"]{padding:15px 13px 20px!important}
          [data-testid="collapsedControl"]{display:none!important}
          .fx-side-brand{display:flex;align-items:center;gap:10px;padding:4px 3px 16px;border-bottom:1px solid var(--x-hair);margin-bottom:15px}.fx-side-mark{width:32px;height:32px;border-radius:9px;border:1px solid #3a3d43;display:grid;place-items:center;color:#fff;font:600 9px/1 "Geist Mono",monospace}.fx-side-name{font-size:15px;color:#fff;letter-spacing:-.02em}.fx-side-sub{font-size:9px;color:var(--x-muted);margin-top:2px}.fx-side-label{font:500 9px/13px "Geist Mono",monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--x-muted);margin:16px 3px 7px}.fx-side-case{border:1px solid var(--x-hair);background:#131416;border-radius:10px;padding:12px;margin-bottom:6px}.fx-side-case strong{display:block;color:#fff;font-size:14px;font-weight:500;line-height:1.3;margin-top:6px}.fx-side-case span{display:block;color:#b5b8be;font-size:10px;line-height:1.45;margin-top:3px}.fx-side-case small{display:block;color:var(--x-muted);font-size:9px;margin-top:7px}.fx-side-live,.fx-side-idle{font:500 8px/11px "Geist Mono",monospace;text-transform:uppercase;letter-spacing:.08em}.fx-side-live{color:#73d0ae}.fx-side-idle{color:#aeb2b8}.fx-side-system{border:1px solid var(--x-hair);background:#111214;border-radius:10px;padding:11px}.fx-side-system div{display:flex;align-items:center;gap:7px;margin:3px 0}.fx-side-system i{width:7px;height:7px;border-radius:50%;background:var(--x-green);display:block}.fx-side-system i.amber{background:var(--x-amber)}.fx-side-system strong{font-size:9px;color:#d4d6db;font-weight:500}.fx-side-system span{display:block;color:var(--x-muted);font-size:8px;line-height:1.4;margin:5px 0 8px}
          [data-testid="stSidebar"] [data-testid="stPageLink-NavLink"]{justify-content:flex-start!important;border-radius:8px!important;border-color:transparent!important;min-height:34px!important;padding:.38rem .55rem!important;margin:2px 0!important;color:#bfc2c8!important;background:transparent!important}
          [data-testid="stSidebar"] [data-testid="stPageLink-NavLink"]:hover{background:#181a1d!important;border-color:#25282d!important;color:#fff!important}
          [data-testid="stSidebar"] [data-testid="stPageLink-NavLink"][aria-disabled="true"]{background:#1a1c20!important;border-color:#31343a!important;color:#fff!important}
          '''
              text = text.replace(anchor, css + "\n" + anchor)
              theme.write_text(text, encoding="utf-8")

          overview = Path("app/overview_ui.py")
          text = overview.read_text(encoding="utf-8")
          if "from app.xai_theme import inject_xai_theme" not in text:
              text = text.replace(
                  "from app.faculty_ui import faculty_css, research_footer, top_navigation\n",
                  "from app.faculty_ui import faculty_css, research_footer, top_navigation\nfrom app.xai_theme import inject_xai_theme\n",
              )
          if 'PRODUCT_NAME = "Pan-Oncology Tumor Board Intelligence"' not in text:
              text = text.replace(
                  "from app.xai_theme import inject_xai_theme\n",
                  'from app.xai_theme import inject_xai_theme\n\nPRODUCT_NAME = "Pan-Oncology Tumor Board Intelligence"\n',
              )
          text = text.replace(
              "def render_final_overview() -> None:\n    faculty_css()\n",
              "def render_final_overview() -> None:\n    faculty_css()\n    inject_xai_theme()\n",
          )
          overview.write_text(text, encoding="utf-8")

          for path in [Path("app/main.py"), *Path("app/pages").glob("*.py")]:
              text = path.read_text(encoding="utf-8")
              if 'initial_sidebar_state="collapsed"' in text:
                  path.write_text(
                      text.replace('initial_sidebar_state="collapsed"', 'initial_sidebar_state="expanded"'),
                      encoding="utf-8",
                  )
          PY

      - name: Verify Python syntax
        run: python -m compileall -q app

      - name: Commit presentation changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "No presentation changes needed"
          else
            git commit -m "Add persistent dashboard navigation rail"
            git push origin main
          fi
