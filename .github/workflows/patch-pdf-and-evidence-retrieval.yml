name: Patch PDF and Evidence Retrieval

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-pdf-and-evidence-retrieval.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply product patches
        shell: python
        run: |
          from pathlib import Path

          # CIViC: remove brittle EvidenceItem.variantHgvs selection. Current CIViC
          # V2 GraphQL can contain accepted evidence rows where that non-null field
          # resolves null. The molecular profile name remains the governed variant
          # representation used by this adapter.
          path = Path('services/civic_molecular_adapter.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('ADAPTER_VERSION = "1.0.0"', 'ADAPTER_VERSION = "1.1.0"', 1)
          if '      variantHgvs\n' not in text:
              raise SystemExit('CIViC variantHgvs query anchor not found')
          text = text.replace('      variantHgvs\n', '', 1)
          old = '''    alteration_terms = [x for x in dict.fromkeys([\n        _norm(requested_alteration),\n        _norm(profile),\n        _norm(node.get("variantHgvs")),\n    ]) if x]\n'''
          new = '''    alteration_terms = [x for x in dict.fromkeys([\n        _norm(requested_alteration),\n        _norm(profile),\n    ]) if x]\n'''
          if old not in text:
              raise SystemExit('CIViC alteration term anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # openFDA: a search with no matching records is a normal empty-result
          # condition. openFDA communicates it as HTTP 404, so normalize that to an
          # empty results payload instead of surfacing a retrieval failure.
          path = Path('services/fda_label_adapter.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace('from urllib.parse import urlencode\n', 'from urllib.error import HTTPError\nfrom urllib.parse import urlencode\n', 1)
          text = text.replace('ADAPTER_VERSION = "1.0.0"', 'ADAPTER_VERSION = "1.1.0"', 1)
          old = '''def _http_get(url: str, timeout: float) -> bytes:\n    req = Request(url, headers={"User-Agent": "CancerTumorBoardIntelligence/1.0 FDA label adapter"})\n    with urlopen(req, timeout=timeout) as response:  # nosec B310 - generated from fixed HTTPS FDA origin\n        final = response.geturl()\n        if not final.startswith("https://api.fda.gov/"):\n            raise FDALabelClientError("openFDA request redirected outside api.fda.gov")\n        return response.read()\n'''
          new = '''def _http_get(url: str, timeout: float) -> bytes:\n    req = Request(url, headers={"User-Agent": "CancerTumorBoardIntelligence/1.0 FDA label adapter"})\n    try:\n        with urlopen(req, timeout=timeout) as response:  # nosec B310 - generated from fixed HTTPS FDA origin\n            final = response.geturl()\n            if not final.startswith("https://api.fda.gov/"):\n                raise FDALabelClientError("openFDA request redirected outside api.fda.gov")\n            return response.read()\n    except HTTPError as exc:\n        if exc.code == 404:\n            return b'{"results": []}'\n        raise\n'''
          if old not in text:
              raise SystemExit('openFDA HTTP anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Synthetic placeholders such as Agent A are intentionally not drug names
          # and must never be sent to openFDA.
          path = Path('services/evidence_commissioning.py')
          text = path.read_text(encoding='utf-8')
          anchor = '''def _dedupe_molecular(records: Iterable[MolecularEvidenceRecord]) -> tuple[MolecularEvidenceRecord, ...]:\n'''
          helper = '''def _queryable_therapy_term(value: str) -> bool:\n    term = " ".join(str(value or "").split()).strip()\n    if not term:\n        return False\n    normalized = term.lower()\n    if normalized.startswith("synthetic "):\n        return False\n    if re.fullmatch(r"(?:agent|drug|therapy|compound)\\s+[a-z0-9]+", normalized):\n        return False\n    return True\n\n\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit('Commissioning helper anchor not found')
              text = text.replace(anchor, helper + anchor, 1)

          old = '''    therapies = _dedupe_terms([\n        *guideline_candidate_therapies(case, guideline_store),\n        *represented_therapy_terms(case),\n        *additional_therapy_terms,\n    ])\n'''
          new = '''    discovered_therapies = _dedupe_terms([\n        *guideline_candidate_therapies(case, guideline_store),\n        *represented_therapy_terms(case),\n        *additional_therapy_terms,\n    ])\n    therapies = tuple(term for term in discovered_therapies if _queryable_therapy_term(term))\n'''
          if old not in text:
              raise SystemExit('Commissioning therapy anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

          # Clinician workspace: PDF is the primary download. JSON remains available
          # as a secondary technical/audit export.
          path = Path('app/pages/00_Clinical_Workspace.py')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'from services.pathway_validation import get_pathway_validation_status\nfrom services.runtime_agents import configure_workflow_runtime\n'
          import_new = 'from services.pathway_validation import get_pathway_validation_status\nfrom services.tumor_board_pdf import build_tumor_board_pdf\nfrom services.runtime_agents import configure_workflow_runtime\n'
          if import_anchor not in text:
              raise SystemExit('Workspace PDF import anchor not found')
          text = text.replace(import_anchor, import_new, 1)

          old = '''    with x2:\n        serial={k:(v.model_dump(mode="json") if hasattr(v,"model_dump") else v) for k,v in result.items()}\n        st.download_button("Download structured result",data=json.dumps(serial,indent=2,default=str),file_name="tumor_board_result.json",mime="application/json",use_container_width=True)\n    st.caption("Clinical trial matching does not establish eligibility. This research system is decision support, not an autonomous treatment directive, and has not been clinically validated for patient care.")\n'''
          new = '''    with x2:\n        pdf_bytes = build_tumor_board_pdf(result)\n        safe_case_id = "".join(ch if ch.isalnum() or ch in "-_" else "-" for ch in str(case.case_id))\n        st.download_button(\n            "Download tumor board report (PDF)",\n            data=pdf_bytes,\n            file_name=f"tumor_board_{safe_case_id}.pdf",\n            mime="application/pdf",\n            use_container_width=True,\n        )\n    with st.expander("Technical / audit export"):\n        serial={k:(v.model_dump(mode="json") if hasattr(v,"model_dump") else v) for k,v in result.items()}\n        st.download_button(\n            "Download structured JSON",\n            data=json.dumps(serial,indent=2,default=str),\n            file_name=f"tumor_board_{safe_case_id}.json",\n            mime="application/json",\n            use_container_width=True,\n        )\n    st.caption("Clinical trial matching does not establish eligibility. This research system is decision support, not an autonomous treatment directive, and has not been clinically validated for patient care.")\n'''
          if old not in text:
              raise SystemExit('Workspace download anchor not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')

      - name: Commit product update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/civic_molecular_adapter.py services/fda_label_adapter.py services/evidence_commissioning.py app/pages/00_Clinical_Workspace.py
          git diff --cached --quiet && exit 0
          git commit -m "Fix evidence retrieval and make PDF the primary clinician export"
          git push origin HEAD:main
