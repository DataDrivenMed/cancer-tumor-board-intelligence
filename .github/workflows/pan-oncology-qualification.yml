name: Pan-Oncology Qualification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  qualification:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Compile product
        run: python -m compileall -q agents services orchestration schemas app

      - name: Pan-oncology qualification gate
        run: pytest -q tests/test_pan_oncology.py

      - name: Full regression suite
        run: pytest -q
