name: Governed Chat Upgrade

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/governed-chat-upgrade.yml'

permissions:
  contents: write

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Patch faculty chat to use governed reasoning service
        shell: python
        run: |
          from pathlib import Path

          p = Path('app/faculty_ui.py')
          text = p.read_text(encoding='utf-8')

          import_anchor = 'from services.pathway_validation import get_pathway_validation_status\n'
          import_line = 'from services.governed_tumor_board_chat import answer_governed_tumor_board_question\n'
          if import_line not in text:
              if import_anchor not in text:
                  raise SystemExit('faculty_ui import anchor missing')
              text = text.replace(import_anchor, import_anchor + import_line, 1)

          start = text.index('def answer_case_question(')
          end = text.index('\ndef render_case_chat(', start)
          replacement = '''def answer_case_question(question: str, result: dict[str, Any], case: Any) -> tuple[str, list[str], str]:\n    \"\"\"Reason across the governed case/evidence record, with deterministic fail-closed fallback.\"\"\"\n    response = answer_governed_tumor_board_question(question, result, case)\n    answer = _txt(response.get(\"answer\"), \"The governed record did not return an answer.\")\n    sources = [str(x) for x in (response.get(\"supporting_sources\") or [])]\n    limitations = [str(x) for x in (response.get(\"limitations\") or []) if str(x).strip()]\n    if limitations:\n        answer += \"\\n\\nLimitations: \" + \"; \".join(limitations)\n    status = _txt(response.get(\"status\"), \"Evidence incomplete\")\n    return answer, sources, status\n\n'''
          text = text[:start] + replacement + text[end+1:]

          old_note = 'Source chips identify the governed channel used. If the current record cannot support an answer, the panel abstains.'
          new_note = 'The panel reasons across the structured case, approved evidence, specialist outputs, missing-information findings, Challenge Review, consensus, and final decision. Source chips identify the governed objects used; unsupported questions still abstain.'
          text = text.replace(old_note, new_note)

          p.write_text(text, encoding='utf-8')

      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate governed chat and full regression
        run: |
          python -m py_compile app/faculty_ui.py services/governed_tumor_board_chat.py
          python -m pytest -q tests/test_governed_tumor_board_chat.py tests/test_faculty_experience_ui.py
          python -m pytest -q
      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/faculty_ui.py
          git commit -m "Upgrade Tumor Board chat to governed reasoning"
          git push origin HEAD:main
